<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour Planificación · Deportes Planificación</title>
<meta name="theme-color" content="#00398F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F7FF; --surface:#FFFFFF; --ink:#0F2A4A; --muted:#566985; --line:#D9E5F6;
  --track:#0074FF; --track-deep:#0062D6; --trail:#3DA0FF; --gold:#FF7000; --navy:#00398F;
  --ok:#2E7D5B; --danger:#B23A48;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(32px,8vw,44px);font-weight:800}
h2{font-size:22px;font-weight:700}
p{margin:0}
.lead{color:var(--muted);margin-top:6px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--track);outline-offset:2px}
.nav :focus-visible,.panel :focus-visible,.lb :focus-visible{outline-color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  background:var(--track-deep);color:#fff;font-weight:600;padding:13px 20px;min-height:48px}
.btn:disabled{opacity:.6;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.linkbtn{border:0;background:none;padding:6px 2px;color:var(--track-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--danger)}

.stack>*+*{margin-top:16px}
.field label,.field .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:10px;padding:12px}
input:focus,select:focus,textarea:focus{border-color:var(--track);outline:none;box-shadow:0 0 0 3px rgba(0,116,255,.22)}
.dur{display:flex;align-items:center;gap:8px}
.dur input{width:88px;text-align:center}
.dur span{color:var(--muted);font-weight:500}
.drop{display:grid;place-items:center;text-align:center;min-height:120px;border:2px dashed #A9CBF5;border-radius:14px;
  background:#fff;color:var(--muted);padding:14px;cursor:pointer;overflow:hidden}
.drop img{max-width:100%;max-height:260px;border-radius:10px;display:block}
.msg{padding:12px 14px;border-radius:10px;font-size:14.5px}
.msg.err{background:#FBE9EC;color:#7C2130}
.msg.ok{background:#E3F4EC;color:#1D5A40}

.seg{display:inline-flex;background:#E1ECFB;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,42,74,.18)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.monthnav{display:flex;align-items:center;gap:6px;font-weight:600}
.monthnav button{border:1.5px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px}
.monthnav button:disabled{opacity:.35;cursor:default}
.monthnav span{min-width:130px;text-align:center;text-transform:capitalize}

.status{margin-top:22px}
.status b{display:block;font:800 clamp(24px,6vw,30px)/1.15 var(--display);letter-spacing:-.01em}
.status span{display:block;color:var(--muted);margin-top:4px}

.panel{background:var(--navy);border-radius:22px;padding:18px 14px 8px;margin-top:16px}
.lane{margin-bottom:14px}
.lane-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;color:#fff;margin-bottom:6px;padding:0 4px}
.linkname{border:0;background:none;color:#fff;font-weight:600;font-size:15px;padding:2px 0;text-align:left;
  display:flex;align-items:baseline;gap:8px;min-width:0}
.linkname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkname .rk{font:800 15px var(--display);color:var(--gold);min-width:14px}
.linkname em{font-style:normal;font-weight:500;opacity:.75;font-size:13px}
.lane-time{text-align:right;line-height:1.2;flex:none}
.lane-time b{font-weight:600;font-size:15px}
.lane-time small{display:block;font-size:12px;opacity:.7}
.strip{position:relative;height:44px;border-radius:22px;background:var(--track);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.trail{position:absolute;left:0;top:0;bottom:0;border-radius:22px;background:var(--trail);
  width:calc((100% - 44px)*var(--p) + 22px);transition:width 1.1s cubic-bezier(.22,.8,.24,1) var(--d,0ms)}
.runner{position:absolute;top:4px;left:calc((100% - 44px)*var(--p) + 4px);border:2px solid #fff;
  transition:left 1.1s cubic-bezier(.22,.8,.24,1) var(--d,0ms)}
.runner.lead{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.4)}
.legend{color:var(--muted);font-size:13.5px;margin-top:10px}

.av{overflow:hidden;--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:none;
  color:#fff;font-family:var(--display);font-weight:700;font-size:calc(var(--s)*.38);line-height:1}

.post{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.post .who{font-weight:600}
.post .who button{border:0;background:none;padding:0;font-weight:600}
.post .meta{color:var(--muted);font-size:14px}
.post .note{margin-top:6px}
.post img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-top:10px;cursor:zoom-in;background:#E1ECFB}
.post .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

.prof-head{display:flex;gap:14px;align-items:center;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px}
.stat{padding:14px 4px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:800 22px var(--display)}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.2;display:block;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dow{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:11.5px;line-height:1.15;color:var(--muted)}
.cell b{font-size:13px;color:inherit}
.cell.blank{background:transparent;border:0}
.cell.l1{background:#D6E8FF;color:var(--ink)}
.cell.l2{background:#9CCBFF;color:var(--ink)}
.cell.l3{background:#0074FF;color:#fff}
.cell.l4{background:#00398F;color:#fff}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.gallery button{border:0;padding:0;background:#E1ECFB;border-radius:10px;overflow:hidden;aspect-ratio:1}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
section+section{margin-top:28px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.track{position:relative;min-height:54px;border-radius:27px;background:var(--track);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.track .startline{position:absolute;left:0;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.55);border-radius:2px}
.track .runner{cursor:pointer;padding:0;left:calc((100% - 42px)*var(--p) + 4px)}
.track .runner:hover{transform:scale(1.1)}
.runinfo{color:#fff;font-size:14.5px;padding:12px 6px 6px;min-height:46px}
.rank{list-style:none;margin:8px 0 0;padding:0}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.rrow.you{background:#E6F1FF;border-radius:10px}
.rrow .rk{width:22px;text-align:center;font:800 16px var(--display);color:var(--muted);flex:none}
.rname{border:0;background:none;padding:2px 0;font-weight:600;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.rtime{text-align:right;line-height:1.2;flex:none}
.rtime small{display:block;font-size:12px;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(520px,calc(100% - 24px));display:flex;background:var(--ink);border-radius:999px;padding:6px;z-index:20;
  box-shadow:0 10px 28px rgba(15,42,74,.32)}
.nav button{flex:1;border:0;background:transparent;color:#C9DBF5;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:8px 4px;border-radius:999px;font-size:12px;font-weight:600}
.nav button[aria-current=page]{background:var(--track);color:#fff}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-weight:500;
  transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translate(-50%,0)}
.lb{position:fixed;inset:0;background:rgba(6,20,40,.92);z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:16px;gap:12px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:78vh;border-radius:10px}
.lb p{color:#fff;text-align:center}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;border:0;background:rgba(255,255,255,.15);
  color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px}
.auth-card{margin-top:22px}
.hint{color:var(--muted);font-size:13.5px;margin-top:6px}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Foto de evidencia"></div>
<noscript><div class="wrap">Esta página necesita JavaScript para funcionar.</div></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIGURACIÓN ============ */
const SUPABASE_URL = 'https://hwmjxzkvzuuvgtuetcel.supabase.co';
const SUPABASE_KEY = 'sb_publishable_U4lNFHOS_sT_Kvikw142aQ_NFRlNsLX';
const SPORTS = ['Correr','Caminar','Ciclismo','Natación','Gimnasio','Fútbol','Senderismo','Yoga','Otro'];
const COUNTRIES = ['Chile','Argentina','Colombia','Brasil','Otro'];
const APP_NAME = 'Tour Planificación';
const APP_SUB = 'Deportes Planificación';
const SEASON_START = '2026-10-01', SEASON_END = '2026-12-31';
const SEASON_MONTHS = ['2026-10','2026-11','2026-12'];

/* ============ UTILIDADES ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const AVCOLORS = ['#C8452C','#0F8B8D','#A8671A','#3D5A80','#8E5572','#2E7D5B','#B23A48','#4A5AB8'];

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function currentMonth(){ return todayStr().slice(0,7); }
function seasonMonth(){ const k=currentMonth(); return k<SEASON_MONTHS[0]?SEASON_MONTHS[0]:(k>SEASON_MONTHS[2]?SEASON_MONTHS[2]:k); }
function inSeason(a){ return a.activity_date>=SEASON_START && a.activity_date<=SEASON_END; }
function monthKey(s){ return s.slice(0,7); }
function addMonths(key, delta){ let [y,m]=key.split('-').map(Number); m+=delta; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; }
function daysInMonth(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m,0).getDate(); }
function firstWeekday(key){ const [y,m]=key.split('-').map(Number); return (new Date(y,m-1,1).getDay()+6)%7; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dayShift(s, delta){ const d=parseDate(s); d.setDate(d.getDate()+delta); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateLabel(s){
  const t=todayStr(); if(s===t) return 'Hoy'; if(s===dayShift(t,-1)) return 'Ayer';
  const d=parseDate(s); return `${d.getDate()} ${MON3[d.getMonth()]}`;
}
function fmt(min){ const h=Math.floor(min/60), m=min%60; if(h===0) return `${m} min`; if(m===0) return `${h} h`; return `${h} h ${m} min`; }
function hdec(min){ return (min/60).toFixed(1).replace('.',',').replace(/,0$/,''); }
function initials(name){ const p=String(name||'?').trim().split(/\s+/); return ((p[0]?.[0]||'?')+(p[1]?.[0]||'')).toUpperCase(); }
function colorOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return AVCOLORS[h%AVCOLORS.length]; }
function avatarInner(p){
  const u = p.avatar_path ? urlOf(p.avatar_path) : '';
  return u ? `<img src="${esc(u)}" alt="">` : esc(initials(p.name));
}
function avatar(p, size=40, extra=''){
  return `<div class="av ${extra}" style="--s:${size}px;background:${colorOf(p.id)}" aria-hidden="true">${avatarInner(p)}</div>`;
}

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3200); }

/* ============ ESTADO ============ */
const state = {
  session:null, me:null, profiles:[], profMap:new Map(), acts:[],
  tab:'race', raceMode:'month', raceMonth:seasonMonth(),
  profId:null, profMonth:seasonMonth(), authMode:'login', editing:false, busy:false
};
let sb;
let renderToken = 0;

/* ============ DATOS ============ */
async function fetchActivities(){
  let all=[], from=0; const size=1000;
  while(true){
    const { data, error } = await sb.from('activities')
      .select('id,user_id,activity_date,sport,minutes,photo_path,note,created_at')
      .order('activity_date',{ascending:false}).order('created_at',{ascending:false}).order('id')
      .range(from, from+size-1);
    if(error) throw error;
    all = all.concat(data);
    if(data.length < size) break;
    from += size;
  }
  return all;
}
async function loadData(){
  let [pr, acts] = await Promise.all([
    sb.from('profiles').select('id,name,country,avatar_path').order('name'),
    fetchActivities()
  ]);
  state.hasAvatar = true;
  if(pr.error && /avatar_path/.test(pr.error.message||'')){
    state.hasAvatar = false;
    pr = await sb.from('profiles').select('id,name,country').order('name');
  }
  if(pr.error) throw pr.error;
  state.profiles = pr.data;
  state.profMap = new Map(pr.data.map(p=>[p.id,p]));
  state.acts = acts;
  state.me = state.profMap.get(state.session.user.id) || null;
  await ensureUrls(state.profiles.map(p=>p.avatar_path));
}

const urlCache = new Map();
async function ensureUrls(paths){
  const now=Date.now();
  const need=[...new Set(paths.filter(Boolean))].filter(p=>{ const c=urlCache.get(p); return !c || c.exp < now+60000; });
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    const { data, error } = await sb.storage.from('evidence').createSignedUrls(chunk, 3600);
    if(error || !data) continue;
    data.forEach(r=>{ if(r.signedUrl) urlCache.set(r.path,{url:r.signedUrl,exp:now+3600*1000}); });
  }
}
const urlOf = p => urlCache.get(p)?.url || '';

function ranking(pred){
  const m = new Map(state.profiles.map(p=>[p.id,0]));
  for(const a of state.acts){ if(pred(a) && m.has(a.user_id)) m.set(a.user_id, m.get(a.user_id)+a.minutes); }
  const rows=[...m].map(([id,min])=>({id,min,p:state.profMap.get(id)}));
  rows.sort((a,b)=>b.min-a.min || a.p.name.localeCompare(b.p.name,'es'));
  let prev=null, rank=0;
  rows.forEach((r,i)=>{ if(r.min!==prev){ rank=i+1; prev=r.min; } r.rank=rank; });
  return rows;
}
function earliestMonth(){
  let min=seasonMonth();
  for(const a of state.acts){ const k=monthKey(a.activity_date); if(k<min) min=k; }
  return min;
}

/* ============ AUTENTICACIÓN ============ */
function authError(e){
  const m=(e?.message||'').toLowerCase();
  if(m.includes('invalid login')) return 'Correo o contraseña incorrectos.';
  if(m.includes('already registered')) return 'Ese correo ya tiene cuenta. Usa la pestaña "Entrar".';
  if(m.includes('database error')) return 'El código del equipo no es correcto. Pídeselo a quien organiza la carrera.';
  if(m.includes('at least 6')) return 'La contraseña debe tener al menos 6 caracteres.';
  if(m.includes('valid email') || m.includes('invalid email')) return 'Escribe un correo válido.';
  if(m.includes('rate limit')) return 'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  return 'No se pudo completar: ' + (e?.message || 'error desconocido');
}

function heroTrack(){
  const lanes=[{p:.92,c:'#C8452C',l:'A',lead:true},{p:.6,c:'#0F8B8D',l:'B'},{p:.34,c:'#8E5572',l:'C'}];
  return `<div class="panel" aria-hidden="true" style="padding-top:14px">${lanes.map((r,i)=>`
    <div class="lane"><div class="strip" style="--p:0;--d:${i*120}ms" data-p="${r.p}">
      <div class="trail"></div>
      <div class="runner av ${r.lead?'lead':''}" style="--s:36px;background:${r.c}">${r.l}</div>
    </div></div>`).join('')}</div>`;
}

function renderAuth(){
  const signup = state.authMode==='signup';
  $('#app').innerHTML = `
  <div class="wrap">
    <h1>${APP_NAME}</h1>
    <p class="lead">${APP_SUB}. Sube tus horas y mira quién va adelante.</p>
    ${heroTrack()}
    <div class="auth-card">
      <div class="seg" role="group" aria-label="Entrar o crear cuenta">
        <button type="button" data-act="auth-login" aria-pressed="${!signup}">Entrar</button>
        <button type="button" data-act="auth-signup" aria-pressed="${signup}">Crear cuenta</button>
      </div>
      <form id="authForm" class="stack" style="margin-top:18px" novalidate>
        ${signup?`
        <div class="field"><label for="aName">Tu nombre</label>
          <input id="aName" autocomplete="name" maxlength="40" placeholder="Nombre y apellido" required></div>
        <div class="field"><label for="aCountry">País</label>
          <select id="aCountry">${COUNTRIES.map(c=>`<option>${c}</option>`).join('')}</select></div>`:''}
        <div class="field"><label for="aEmail">Correo</label>
          <input id="aEmail" type="email" autocomplete="email" inputmode="email" required></div>
        <div class="field"><label for="aPass">Contraseña</label>
          <input id="aPass" type="password" autocomplete="${signup?'new-password':'current-password'}" minlength="6" required></div>
        ${signup?`
        <div class="field"><label for="aCode">Código del equipo</label>
          <input id="aCode" autocomplete="off" autocapitalize="none" placeholder="Te lo pasa quien organiza" required></div>`:''}
        <div id="authMsg"></div>
        <button class="btn block" id="authBtn" type="submit">${signup?'Crear cuenta':'Entrar'}</button>
      </form>
    </div>
  </div>`;
  animateTracks();
}

async function submitAuth(e){
  e.preventDefault();
  const signup = state.authMode==='signup';
  const email=$('#aEmail').value.trim(), password=$('#aPass').value;
  const msg=$('#authMsg'), btn=$('#authBtn');
  msg.innerHTML='';
  if(!email || !password){ msg.innerHTML='<div class="msg err">Completa el correo y la contraseña.</div>'; return; }
  let name='',country='',code='';
  if(signup){
    name=$('#aName').value.trim(); country=$('#aCountry').value; code=$('#aCode').value.trim();
    if(!name){ msg.innerHTML='<div class="msg err">Escribe tu nombre.</div>'; return; }
    if(!code){ msg.innerHTML='<div class="msg err">Escribe el código del equipo.</div>'; return; }
  }
  btn.disabled=true; btn.textContent = signup?'Creando cuenta…':'Entrando…';
  try{
    if(signup){
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name, country, join_code: code } } });
      if(error) throw error;
      if(!data.session){
        msg.innerHTML='<div class="msg ok">Cuenta creada. Si el proyecto pide confirmar el correo, revisa tu bandeja y luego entra.</div>';
        btn.disabled=false; btn.textContent='Crear cuenta';
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  }catch(err){
    msg.innerHTML=`<div class="msg err">${esc(authError(err))}</div>`;
    btn.disabled=false; btn.textContent = signup?'Crear cuenta':'Entrar';
  }
}

function raceView(){
  const mode=state.raceMode, mk=state.raceMonth, cur=seasonMonth();
  const pred = a => mode==='all' ? inSeason(a) : monthKey(a.activity_date)===mk;
  const rows=ranking(pred);
  const lead=rows[0]?.min || 0;
  const past = mode==='month' && mk<cur;
  const future = mode==='month' && mk>cur;
  const pre = todayStr()<SEASON_START;
  const period = mode==='all' ? 'en total' : ((past||future) ? `en ${MONTHS[+mk.slice(5)-1]}` : 'este mes');

  let title='', sub='';
  const mine=rows.find(r=>r.id===state.me.id);
  if(lead===0){
    if(pre){ title='Arranca el 1 de octubre'; sub='Mientras tanto, crea tu perfil y súbete una foto.'; }
    else { title = past ? 'Ese mes nadie sumó horas' : 'Todavía nadie suma horas';
      sub = past ? '' : 'Sube la primera actividad y sal al frente.'; }
  } else if(mine.min===0){
    title = past ? 'No sumaste horas ese mes' : `Aún no sumas horas ${period}`;
    sub = `${rows[0].p.name} lleva ${fmt(lead)}.`;
  } else if(mine.rank===1){
    const others=rows.filter(r=>r.rank>1);
    title = past ? `Ganaste con ${fmt(mine.min)}` : `Vas primero con ${fmt(mine.min)}`;
    sub = others[0] ? `Ventaja de ${fmt(mine.min-others[0].min)} sobre ${others[0].p.name}.` : '';
    if(rows.filter(r=>r.rank===1).length>1){ title = past ? `Empataste al frente con ${fmt(mine.min)}` : `Vas empatado al frente con ${fmt(mine.min)}`; sub=''; }
  } else {
    const ahead=[...rows].reverse().find(r=>r.min>mine.min);
    title = past ? `Quedaste ${mine.rank}º con ${fmt(mine.min)}` : `Vas ${mine.rank}º con ${fmt(mine.min)}`;
    sub = ahead ? `A ${fmt(ahead.min-mine.min)} de ${ahead.p.name}.` : '';
  }

  const minM=SEASON_MONTHS[0];
  const nav = mode==='month' ? `
    <div class="monthnav">
      <button type="button" data-act="prev" aria-label="Mes anterior" ${mk<=minM?'disabled':''}>‹</button>
      <span>${monthLabel(mk)}</span>
      <button type="button" data-act="next" aria-label="Mes siguiente" ${mk>=SEASON_MONTHS[2]?'disabled':''}>›</button>
    </div>` : '';

  state.raceRows = new Map(rows.map(r=>[r.id,r])); state.raceLead = lead;
  const runners = rows.map((r,i)=>{
    const p = lead>0 ? r.min/lead : 0;
    const isLead = lead>0 && r.rank===1;
    return `<button type="button" class="runner av ${isLead?'lead':''}" data-run="${r.id}" data-p="${p.toFixed(4)}"
      style="--s:34px;--p:0;--d:${Math.min(i*30,500)}ms;background:${colorOf(r.id)};z-index:${100-r.rank}"
      aria-label="${esc(r.p.name)}, ${fmt(r.min)}">${avatarInner(r.p)}</button>`;
  }).join('');
  const list = rows.map(r=>{
    const isLead = lead>0 && r.rank===1, you = r.id===state.me.id;
    return `<li class="rrow${you?' you':''}"><span class="rk">${lead>0?r.rank:'–'}</span>${avatar(r.p,32)}
      <button type="button" class="rname" data-prof="${r.id}">${esc(r.p.name)}${you?'<em>tú</em>':''}</button>
      <span class="rtime"><b>${fmt(r.min)}</b>${(!isLead && lead>0)?`<small>−${fmt(lead-r.min)}</small>`:''}</span></li>`;
  }).join('');
  const empty = lead===0 && !past && !pre ? `<div class="empty" style="padding-top:8px"><button class="btn" data-tab="upload">Subir mi primera actividad</button></div>` : '';

  return `
    <h1>${APP_NAME}</h1>
    <p class="lead">${APP_SUB} · octubre a diciembre 2026</p>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Periodo">
        <button type="button" data-act="mode-month" aria-pressed="${mode==='month'}">Por mes</button>
        <button type="button" data-act="mode-all" aria-pressed="${mode==='all'}">Acumulado</button>
      </div>
      ${nav}
    </div>
    <div class="status"><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div>
    <div class="panel">
      <div class="track" id="track"><div class="startline"></div>${runners}</div>
      <p class="runinfo" id="runInfo">Toca un círculo para ver quién es y cuántas horas lleva.</p>
    </div>
    <p class="legend">Quien va más adelante lleva más horas. Los círculos cercanos se apilan en filas para no taparse.</p>
    <section><h2>Posiciones</h2><ol class="rank">${list}</ol></section>
    ${empty}`;
}

function layoutTrack(){
  const tr=$('#track'); if(!tr) return;
  const runners=[...tr.querySelectorAll('.runner[data-p]')].sort((a,b)=>parseFloat(a.dataset.p)-parseFloat(b.dataset.p));
  const usable=Math.max(tr.clientWidth-42,1), size=34, MAXR=4, last=[];
  runners.forEach(el=>{
    const x=usable*parseFloat(el.dataset.p)+4;
    let row=-1;
    for(let r=0;r<MAXR;r++){ if(last[r]===undefined || x-last[r]>=size+2){ row=r; break; } }
    if(row<0){ let bg=-1e9; for(let r=0;r<MAXR;r++){ const g=x-last[r]; if(g>bg){ bg=g; row=r; } } }
    last[row]=x;
    el.style.top=(8+row*38)+'px';
  });
  const used=Math.max(last.length,1);
  tr.style.height=(used*38+12)+'px';
}
window.addEventListener('resize', ()=>{ clearTimeout(window.__lt); window.__lt=setTimeout(layoutTrack,120); });

function showRunInfo(id){

}

let pendingFile=null;
function bindUpload(){
  pendingFile=null;
  $('#upPhoto').addEventListener('change', e=>{
    const f=e.target.files[0]; pendingFile=f||null;
    const drop=$('#drop');
    if(!f){ drop.innerHTML='<span id="dropText">Toca para elegir o sacar una foto</span>'; return; }
    const url=URL.createObjectURL(f);
    drop.innerHTML=`<img src="${url}" alt="Vista previa de la foto elegida">`;
  });
  $('#upForm').addEventListener('submit', submitUpload);
}
function compressImage(file, maxSide=1400, quality=.82, square=false){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let sx=0, sy=0, sw=img.width, sh=img.height;
      if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=m; sh=m; }
      const k=Math.min(1, maxSide/Math.max(sw,sh));
      const w=Math.round(sw*k), h=Math.round(sh*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b?resolve(b):reject(new Error('No se pudo procesar la imagen.')),'image/jpeg',quality);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen. Prueba con una captura en JPG o PNG.')); };
    img.src=url;
  });
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }

async function submitUpload(e){
  e.preventDefault();
  const msg=$('#upMsg'), btn=$('#upBtn'); msg.innerHTML='';
  const date=$('#upDate').value, sport=$('#upSport').value, note=$('#upNote').value.trim();
  const mins=(parseInt($('#upH').value,10)||0)*60 + (parseInt($('#upM').value,10)||0);
  const fail = t => { msg.innerHTML=`<div class="msg err">${esc(t)}</div>`; };
  if(!date) return fail('Elige la fecha.');
  if(date>todayStr()) return fail('La fecha no puede ser futura.');
  if(date>SEASON_END) return fail('El tour terminó el 31 de diciembre.');
  if(todayStr()>=SEASON_START && date<SEASON_START) return fail('El tour parte el 1 de octubre. Elige una fecha desde ese día.');
  if(mins<=0) return fail('Indica cuánto tiempo entrenaste.');
  if(mins>1440) return fail('La duración no puede superar 24 horas.');
  const already=state.acts.filter(a=>a.user_id===state.me.id && a.activity_date===date).reduce((s,a)=>s+a.minutes,0);
  if(already+mins>1440) return fail('Ese día ya suma más de 24 horas registradas.');
  if(!pendingFile) return fail('Falta la foto de evidencia.');

  state.busy=true; btn.disabled=true; btn.textContent='Subiendo…';
  let path=null;
  try{
    const blob=await compressImage(pendingFile);
    path=`${state.me.id}/${uid()}.jpg`;
    const up=await sb.storage.from('evidence').upload(path, blob, { contentType:'image/jpeg', upsert:false });
    if(up.error) throw up.error;
    const ins=await sb.from('activities').insert({ user_id:state.me.id, activity_date:date, sport, minutes:mins, photo_path:path, note:note||null });
    if(ins.error){ await sb.storage.from('evidence').remove([path]); throw ins.error; }
    await loadData();
    state.busy=false; pendingFile=null;
    toast(date>=SEASON_START ? 'Actividad subida' : 'Actividad guardada. Contará cuando parta el tour, el 1 de octubre.');
    state.raceMode='month'; state.raceMonth=seasonMonth();
    go('race');
  }catch(err){
    state.busy=false; btn.disabled=false; btn.textContent='Subir actividad';
    fail(err.message || 'No se pudo subir la actividad. Intenta de nuevo.');
  }
}

function streakOf(dates){
  const set=new Set(dates); let d=todayStr();
  if(!set.has(d)) d=dayShift(d,-1);
  let n=0; while(set.has(d)){ n++; d=dayShift(d,-1); }
  return n;
}
async function profileView(){
  const id=state.profId || state.me.id;
  const p=state.profMap.get(id) || state.me;
  const isMe=p.id===state.me.id;
  const mk=state.profMonth, cur=seasonMonth();
  const mine=state.acts.filter(a=>a.user_id===p.id);
  const inMonth=mine.filter(a=>monthKey(a.activity_date)===mk);
  const byDay=new Map();
  inMonth.forEach(a=>{ const d=+a.activity_date.slice(8,10); byDay.set(d,(byDay.get(d)||0)+a.minutes); });
  const monthMin=inMonth.reduce((s,a)=>s+a.minutes,0);
  const totalMin=mine.filter(inSeason).reduce((s,a)=>s+a.minutes,0);
  const streak=streakOf(mine.filter(inSeason).map(a=>a.activity_date));
  const rk=ranking(a=>monthKey(a.activity_date)===mk).find(r=>r.id===p.id);

  const first=firstWeekday(mk), dim=daysInMonth(mk);
  const todayD = mk===currentMonth() ? +todayStr().slice(8,10) : -1;
  let cells=['L','M','X','J','V','S','D'].map(d=>`<div class="dow" aria-hidden="true">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div class="cell blank"></div>';
  for(let d=1; d<=dim; d++){

    const lv=m===0?'':(m<45?'l1':m<90?'l2':m<150?'l3':'l4');
    cells+=`<div class="cell ${lv} ${d===todayD?'today':''}" ${m?`title="${fmt(m)}" aria-label="Día ${d}: ${fmt(m)}"`:''}>${m?`<b>${hdec(m)}</b>`:''}<span>${d}</span></div>`;

  const photos=inMonth.filter(a=>a.photo_path);

  const gallery = photos.length
    ? `<div class="gallery">${photos.map(a=>`<button type="button" data-lb="${a.id}" aria-label="Ver evidencia del ${dateLabel(a.activity_date)}"><img src="${esc(urlOf(a.photo_path))}" alt="" loading="lazy"></button>`).join('')}</div>`
    : `<p class="empty">Sin fotos este mes.</p>`;

  const picker = `<div class="field" style="margin-top:16px"><label for="profPick">Ver el perfil de</label>
    <select id="profPick">${[state.me,...state.profiles.filter(x=>x.id!==state.me.id)].map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}${x.id===state.me.id?' (tú)':''}</option>`).join('')}</select></div>`;

  const editForm = isMe && state.editing ? `
    <form id="editForm" class="stack" style="margin-top:16px">
      <div class="field"><label for="eName">Nombre</label><input id="eName" maxlength="40" value="${esc(p.name)}" required></div>
      <div class="field"><label for="eCountry">País</label>
        <select id="eCountry">${COUNTRIES.map(c=>`<option ${c===p.country?'selected':''}>${c}</option>`).join('')}</select></div>
      ${state.hasAvatar?`<div class="field"><label for="eAvatar">Foto de perfil (opcional)</label><input id="eAvatar" type="file" accept="image/*"></div>`:''}
      <div id="eMsg"></div>
      <div style="display:flex;gap:10px"><button class="btn" type="submit">Guardar cambios</button>
        <button class="btn ghost" type="button" data-act="cancel-edit">Cancelar</button></div>
    </form>` : '';

  return `
    <h1>Perfil</h1>
    ${picker}
    <div class="prof-head">
      ${avatar(p,64)}
      <div>
        <h2>${esc(p.name)}</h2>
        <p class="lead" style="margin:0">${esc(p.country||'')}${p.country&&rk&&monthMin>0?' · ':''}${rk&&monthMin>0?`${rk.rank}º en ${MONTHS[+mk.slice(5)-1]}`:''}</p>
      </div>
    </div>
    ${isMe && !state.editing?`<p style="margin-top:12px"><button class="linkbtn" data-act="edit">Editar perfil y foto</button></p>`:''}
    ${editForm}
    <div class="stats">
      <div class="stat"><b>${hdec(monthMin)||0} h</b><span>en el mes</span></div>
      <div class="stat"><b>${byDay.size}</b><span>días activos</span></div>
      <div class="stat"><b>${streak}</b><span>${streak===1?'día':'días'} de racha</span></div>
      <div class="stat"><b>${hdec(totalMin)||0} h</b><span>en total</span></div>
    </div>
    <section>
      <div class="toolbar" style="margin-top:0">
        <h2>Calendario</h2>
        <div class="monthnav">
          <button type="button" data-act="pprev" aria-label="Mes anterior" ${mk<=SEASON_MONTHS[0]?'disabled':''}>‹</button>

  const lb=$('#lb');
  lb.innerHTML=`<button type="button" class="x" aria-label="Cerrar">×</button>
    <img src="${esc(urlOf(a.photo_path))}" alt="Evidencia de ${esc(p.name)}">
    <p>${esc(p.name)} · ${esc(a.sport)} · ${fmt(a.minutes)} · ${dateLabel(a.activity_date)}${a.note?`<br>${esc(a.note)}`:''}</p>`;
  lb.hidden=false; $('.x',lb).focus();
}
function closeLightbox(){ const lb=$('#lb'); lb.hidden=true; lb.innerHTML=''; }

/* ============ EVENTOS ============ */
document.addEventListener('click', async e=>{
  const lb=$('#lb');
  if(!lb.hidden && (e.target===lb || e.target.closest('.x'))){ closeLightbox(); return; }
  const el=e.target.closest('[data-tab],[data-prof],[data-lb],[data-del],[data-act],[data-run]');
  if(!el) return;
  if(el.dataset.run){ showRunInfo(el.dataset.run); return; }
  if(el.dataset.tab){ go(el.dataset.tab); return; }
  if(el.dataset.prof){ go('profile', el.dataset.prof===state.me?.id?null:el.dataset.prof); return; }
  if(el.dataset.lb){ openLightbox(el.dataset.lb); return; }
  if(el.dataset.del){
    if(!confirm('¿Borrar esta actividad? También se elimina su foto.')) return;
    const a=state.acts.find(x=>x.id===el.dataset.del); if(!a) return;
    const { error } = await sb.from('activities').delete().eq('id',a.id);
    if(error){ toast('No se pudo borrar. Intenta de nuevo.'); return; }
    if(a.photo_path) await sb.storage.from('evidence').remove([a.photo_path]);
    await loadData(); toast('Actividad borrada'); renderView(false); return;
  }
  switch(el.dataset.act){
    case 'auth-login': state.authMode='login'; renderAuth(); break;
    case 'auth-signup': state.authMode='signup'; renderAuth(); break;
    case 'mode-month': state.raceMode='month'; renderView(true); break;
    case 'mode-all': state.raceMode='all'; renderView(true); break;
    case 'prev': state.raceMonth=addMonths(state.raceMonth,-1); renderView(true); break;
    case 'next': state.raceMonth=addMonths(state.raceMonth,1); renderView(true); break;
    case 'pprev': state.profMonth=addMonths(state.profMonth,-1); renderView(false); break;
    case 'pnext': state.profMonth=addMonths(state.profMonth,1); renderView(false); break;
    case 'edit': state.editing=true; renderView(false); break;
    case 'cancel-edit': state.editing=false; renderView(false); break;
    case 'logout': await sb.auth.signOut(); break;
  }
});
document.addEventListener('submit', async e=>{
  if(e.target.id==='authForm') return submitAuth(e);
  if(e.target.id==='editForm'){
    e.preventDefault();
    const name=$('#eName').value.trim(), country=$('#eCountry').value;
    if(!name){ $('#eMsg').innerHTML='<div class="msg err">El nombre no puede estar vacío.</div>'; return; }
    const upd={ name, country };
    const file=$('#eAvatar')?.files[0]; const oldPath=state.me.avatar_path; let newPath=null;
    try{
      if(file){
        const blob=await compressImage(file,400,.85,true);
        newPath=`${state.me.id}/avatar-${uid()}.jpg`;
        const up=await sb.storage.from('evidence').upload(newPath,blob,{contentType:'image/jpeg'});
        if(up.error) throw up.error;
        upd.avatar_path=newPath;
      }
      const { error } = await sb.from('profiles').update(upd).eq('id',state.me.id);
      if(error){ if(newPath) await sb.storage.from('evidence').remove([newPath]); throw error; }
      if(newPath && oldPath) await sb.storage.from('evidence').remove([oldPath]);
    }catch(err){ $('#eMsg').innerHTML=`<div class="msg err">${esc(err.message||'No se pudo guardar.')}</div>`; return; }
    await loadData(); state.editing=false; toast('Perfil actualizado'); renderView(false);
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='profPick'){ state.profId = e.target.value===state.me.id ? null : e.target.value; state.editing=false; state.profMonth=seasonMonth(); renderView(false); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLightbox(); });

async function refresh(){
  if(!state.session || !state.me || state.busy || state.editing || state.tab==='upload' || !$('#lb').hidden) return;
  try{ await loadData(); renderView(false); }catch(_){}
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
setInterval(()=>{ if(!document.hidden) refresh(); }, 120000);

/* ============ ARRANQUE ============ */
(async function boot(){
  if(!window.supabase){
    $('#app').innerHTML='<div class="wrap"><div class="msg err">No se pudo cargar la librería de Supabase. Revisa tu conexión y recarga la página.</div></div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='INITIAL_SESSION') return;
    const sameUser = state.session && session && state.session.user.id===session.user.id;
    state.session=session;
    if(event==='TOKEN_REFRESHED' || (event==='SIGNED_IN' && sameUser) || event==='USER_UPDATED') return;
    setTimeout(()=>route(),0);
  });
  const { data } = await sb.auth.getSession();
  state.session=data.session;
  route();
})();
</script>
</body>
</html>
